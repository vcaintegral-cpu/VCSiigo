# Cambie "vcsiigo-core" por un nombre único (fly launch --no-deploy --copy-config lo ajusta).
app = "vcsiigo-core"
primary_region = "mia"   # Miami: la región más cercana a Colombia con certeza; verifique si hay "bog" en su cuenta

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # Valores PÚBLICOS (van al navegador). Reemplácelos por los de su proyecto Supabase.
    NEXT_PUBLIC_SUPABASE_URL = "https://REEMPLAZAR.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "REEMPLAZAR"

[env]
  PORT = "3000"
  # Públicos. El worker los lee en tiempo de ejecución (deben coincidir con build.args).
  NEXT_PUBLIC_SUPABASE_URL = "https://REEMPLAZAR.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "REEMPLAZAR"
  SIIGO_PARTNER_ID = "REEMPLAZAR"   # nombre de su aplicación (3-100 letras/números, sin espacios), igual para todas las empresas

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # 24 h: la máquina nunca se duerme
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/api/salud"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
